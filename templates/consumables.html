{% extends "base.html" %}

{% block title %}GT Helper{% endblock %}

{% block content %}
<style>
    #controls {
        margin-top: 20px;
    }
    .clickable-item {
        padding: 12px 15px;
        margin-bottom: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        background-color: #fff;
    }
    .clickable-item:hover {
        background-color: #e9ecef;
        border-color: #3498db;
        transform: translateX(5px);
    }
    .clickable-item.selected {
        background-color: #3498db;;
        color: white;
    }
    .days-text {
        display: block; margin-bottom: 8px; font-weight: bold; color: #333;
    }
    .text-input {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border: 2px solid #ddd;
        border-radius: 6px;
        background-color: #fff;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }
    .text-input:hover {
        border-color: #007bff;
    }
    .text-input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }
</style>

<div class="content">
    <h2>Consumables</h2>
    <div id="days-box">
        <label class="days-text">Days of consumables wanted:</label>
        <input type="text" class="text-input" id="days-value" name="days" value="2">
    </div>
    <h3>Bases</h3>
    <div id="controls">Fetching base names...</div>

</div>

<div class="content">
    <h2>Consumables needed</h2>
    <div id="result">
        <table id="result-table"></table>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.datatables.net/2.3.6/css/dataTables.dataTables.css" />
<script src="https://cdn.datatables.net/2.3.6/js/dataTables.js"></script>

<script>
    
    // function renderMatName(name) {
    //     assetName = name.split(" ").join("")
    //     return <svg width="24" height="24" class="icon">
    //         <use href="/static/assets.svg#AI"></use>
    //         <!-- <use href="assets#AI"></use> -->
    //     </svg>
    // }

    $(document).ready(function() {
        // Make AJAX request to Flask server
        $.ajax({
            url: '/fetch-bases',
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                // Clear loading message
                $('#controls').empty();
                // Create checkboxes for each name
                data.forEach(function(base, index) {
                    // Escape HTML to prevent XSS
                    var escapedName = $('<div>').text(base[0]).html();
                    
                    // Create clickable div element
                    var baseSelect = $('<div>', {
                        class: 'clickable-item',
                        id: base[1],
                        text: escapedName,
                        'data-value': escapedName
                    });
                    
                    // Add click handler to toggle selection
                    baseSelect.click(function() {
                        $(this).toggleClass('selected');

                        // Collect IDs of all selected items
                        var selectedIds = [];
                        $('.clickable-item.selected').each(function() {
                            selectedIds.push($(this).attr('id'));
                        });
                        
                        // Make AJAX call to /consumables
                        $.ajax({
                            url: '/compute-consumables',
                            method: 'GET',
                            traditional: true,
                            data: {id: selectedIds, days: $("#days-value").val()},
                            success: function(response) {
                                console.log('Consumables endpoint response:', response);
                                  // Generate table from JSON
                                let table = '<thead><tr>';
                                ["Material", "Needed"].forEach(key => {
                                    table += `<th>${key}</th>`;
                                });
                                table += '</tr></thead><tbody>';
                                
                                response.forEach(row => {
                                    table += '<tr>';
                                    Object.values(row).forEach(value => {
                                    table += `<td>${value}</td>`;
                                    });
                                    table += '</tr>';
                                });
                                table += '</tbody>';
                                $('#result-table').html(table)                                
                            },
                            error: function(xhr, status, error) {
                                console.error('Error calling /consumables:', error);
                            }

                        });
                    });
                        
                    // Add to controls div
                    $('#controls').append(baseSelect);
                });
            },
            error: function(xhr, status, error) {
                // Handle errors
                $('.controls').html('<p style="color: red;">Error loading names: ' + error + '</p>');
                console.error('AJAX Error:', status, error);
            }
        });
        $('#result-table').dataTable({searching: false, paging: false, info: false})
    });

</script>

{% endblock %}
